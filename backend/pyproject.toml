[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--cov=apps --cov-report=term-missing:skip-covered --cov-fail-under=70"

[tool.coverage.run]
branch = false
omit = [
    "**/migrations/*",
    "**/apps.py",
    "**/admin.py",
    "**/ollama_provider.py",
    "**/openai_provider.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
