# Production stack: Postgres + Django/gunicorn + nginx (Vue build).
# Fresh machine: cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sqli_interviews}
      POSTGRES_USER: ${POSTGRES_USER:-sqli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sqli_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sqli} -d ${POSTGRES_DB:-sqli_interviews}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://sqli:sqli_dev_password@db:5432/sqli_interviews}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Optional direct API access (Swagger at :8000/api/docs/)
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
